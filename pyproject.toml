[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyside-nova"
dynamic = ["version"]
description = "Inspired by Quasar, an enterprise-grade QML component library for PySide6."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "pyside-nova contributors" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]
keywords = ["PySide6", "QML", "Qt", "UI", "components", "quasar", "design-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build"]

[project.urls]
Homepage = "https://github.com/eagleye-china/pyside-nova"
Repository = "https://github.com/eagleye-china/pyside-nova"
Changelog = "https://github.com/eagleye-china/pyside-nova/blob/main/CHANGELOG.md"
Documentation = "https://github.com/eagleye-china/pyside-nova/tree/main/docs"
"Bug Tracker" = "https://github.com/eagleye-china/pyside-nova/issues"

[tool.hatch.version]
path = "src/pyside_nova/__about__.py"

[tool.hatch.build.targets.wheel]
# wheel 内完整包含 QML 资源（qmldir + .qml），pip 安装即用
packages = ["src/pyside_nova"]
# 品牌史料资产（历代徽标）只留仓库，不进运行时 wheel：
# 2 张历史 PNG 共 4.16 MB，若不排除会把 419 KB 的 wheel 撑到 4.5 MB。
# 正式库标 pyside-nova-logo*.svg 与 32px 基础标仍随包分发。
exclude = [
    "src/pyside_nova/resources/icons/*.png",
    "src/pyside_nova/resources/icons/nova-*.svg",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyside_nova",
    "tests",
    "examples",
    "scripts",
    "api",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = [
    "src/pyside_nova/resources/icons/*.png",
    "src/pyside_nova/resources/icons/nova-*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
