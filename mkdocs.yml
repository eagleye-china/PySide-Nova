# MkDocs 文档站配置（pyside-nova 1.2.0 · 20 项组合根容器 / 5 项增量 · L6 工程化：可搜索文档站）
# 构建验证：python -m mkdocs build；本地预览：python -m mkdocs serve
# ⚠️ 站点部署 / GitHub Pages / 正式域名属发布边界，归 CSA（伙伴）。
#    site_url 为按 repo_url 推导的 GitHub Pages 规范值（去 example.com 占位）；
#    若 CSA 采用自定义域名，仅需改 site_url 一行，部署动作本轮不执行。
site_name: pyside-nova
site_description: 面向 PySide6 的企业级 QML 组件库（对标 Quasar Framework）
site_url: https://eagleye-china.github.io/pyside-nova/
repo_url: https://github.com/eagleye-china/pyside-nova
repo_name: eagleye-china/pyside-nova
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  templates/
  ai/
  MASTER_PLAN.md.bak

# T9/P1+P2 文档站产品化层
# extra_css / extra_javascript：手写交互资产 + 生成物 nova-data.js（版本/组件唯一事实源）
extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/nova-data.js
  - assets/js/nova-common.js
  - assets/js/version-switcher.js
  - assets/js/playground.js
  - assets/js/layout-builder.js
  - assets/js/examples.js

extra:
  # Material 官方语言切换器（中文站 / 英文骨架站）；站点部署归 CSA
  alternate:
    - name: 简体中文
      link: ./
      lang: zh
    - name: English
      link: en/
      lang: en

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

plugins:
  - search               # 全站搜索（随站点上线生效）
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      # 中文标题锚点：默认 slugify 会剥离非 ASCII，导致白皮书 25 处手写锚点失配
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
      toc_depth: 4          # 右侧页内 TOC 允许 h2/h3/h4 三级嵌套（配合 extra.css 编号）

nav:
