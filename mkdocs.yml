      - NovaDualSide: components/NovaDualSide.md
      - NovaTabShell: components/NovaTabShell.md
      - NovaThreeColumn: components/NovaThreeColumn.md
      - NovaCompare: components/NovaCompare.md
      - NovaCardGrid: components/NovaCardGrid.md
      - NovaModal: components/NovaModal.md
      - NovaDrawerPanel: components/NovaDrawerPanel.md
      - NovaSetupWizard: components/NovaSetupWizard.md
      - NovaBlankPage: components/NovaBlankPage.md
      - NovaDesktop: components/NovaDesktop.md
      - NovaMobile: components/NovaMobile.md
      - NovaFlexLayout: components/NovaFlexLayout.md
      - NovaChat: components/NovaChat.md
      - NovaAgent: components/NovaAgent.md
      - NovaDE: components/NovaDE.md
      - NovaCopilot: components/NovaCopilot.md
